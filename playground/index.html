<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cajoa Playground</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #0f1115;
        color: #e8e8ea;
        max-width: 480px;
        margin: 40px auto;
        padding: 0 16px;
      }
      section {
        background: #181b22;
        border: 1px solid #2a2f3a;
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 16px;
      }
      h1,
      h2 {
        margin-top: 0;
      }
      button,
      input {
        font: inherit;
        padding: 6px 12px;
        border-radius: 8px;
        border: 1px solid #3a4150;
        background: #222733;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        margin-bottom: 8px;
      }
      ul {
        padding-left: 0;
        list-style: none;
      }
      li {
        display: flex;
        gap: 8px;
        align-items: center;
        margin: 6px 0;
      }
      li span {
        flex: 1;
        cursor: pointer;
      }
      li.done span {
        text-decoration: line-through;
        opacity: 0.5;
      }
      input[type="checkbox"] {
        width: auto;
        margin-right: 6px;
      }
      input[type="range"] {
        padding: 0;
      }
      select {
        font: inherit;
        padding: 6px 12px;
        border-radius: 8px;
        border: 1px solid #3a4150;
        background: #222733;
        color: inherit;
        margin-bottom: 8px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
